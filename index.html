<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Boot value only: theme.tsx replaces this with the resolved
         `--surface-base` as soon as the palette is applied. G17 night.

         P3.4 — AND IT IS ALSO THE INSTALLED APP'S STATUS BAR. iOS paints the
         status-bar region with this colour, so keeping it in step with the
         palette is what stops the "full white band" the product owner saw: the
         band is the app's own background in whichever theme is showing, and
         the system picks contrasting glyphs against it.

         ★ `apple-mobile-web-app-status-bar-style: black-translucent` is the
           OTHER way to do this and is deliberately NOT used. It does put the
           content under the bar on iOS — and it also forces the clock and the
           battery to WHITE, permanently. The coordinator's default theme is
           LIGHT (theme.tsx, `defaultThemeFor`), so that trade buys an
           edge-to-edge bar and pays for it with an unreadable clock for the one
           person in phase 1 who has an account. The product owner's own brief
           asks for a gradient "adapted to both themes", which is the same
           requirement read from the other end. If he wants edge-to-edge badly
           enough to accept a permanently dark scrim at the top of the light
           theme, this is the one line that changes.

           ⚠️ IT WAS TRIED — one build on 2026-09-01 — AND REFUSED ON A REAL
             iPAD. The paragraph above turned out to be exactly right about the
             cost. See the closed arbitration below the theme-color tags. -->
    <!-- PO POINT 1 (2026-08-31) — THE STATUS BAR IS THE SAME IN BOTH THEMES ON
         A REAL INSTALLED iPAD, and one unscoped meta tag is why.

         iOS reads `theme-color` for the installed app's status bar AT LAUNCH.
         `theme.tsx` keeps the unscoped tag below in step with the palette at
         runtime, which is right for a browser tab and arrives far too late for
         a home-screen app — so what the product owner saw was the boot literal,
         `#0B1119`, painted behind the clock in the LIGHT theme too.

         ★ MEDIA-SCOPED TAGS FIRST, UNSCOPED LAST, AND THE ORDER IS THE WHOLE
           MECHANISM. A browser takes the FIRST `theme-color` whose `media`
           matches; an unscoped tag matches everything, so an unscoped tag
           placed first would shadow both of these permanently. Last, it is the
           fallback for anything that ignores `media` — and it is the one
           `theme.tsx` writes to, selected as `:not([media])` precisely so a
           live theme change cannot overwrite these two.

         ⚠️ IT FOLLOWS THE SYSTEM SCHEME, NOT THE APP'S OWN CHOICE. A
           coordinator who forces the dark theme on a light iPad gets a light
           status bar. That is the limit of what meta tags can express, it is
           strictly better than one wrong colour in both directions, and the
           way past it is `black-translucent` below. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F4F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1119" />
    <meta name="theme-color" content="#0B1119" />

    <!-- ⚖️ PO POINT 1 — THE ARBITRATION IS CLOSED, 2026-09-01 (second look):
         OPTION A. `default`, AND THE TAG IS EXPLICIT RATHER THAN ABSENT.

         Option B (`black-translucent`) was tried in production for one build
         and the product owner rejected it ON A REAL INSTALLED iPAD, with the
         reason that settles it:

           · in the LIGHT theme the scrim is a DARK band across the top of a
             light app — he called it ugly, and he is right; it is the cost the
             option was always going to charge, seen at full size rather than
             in a capture;
           · in the DARK theme there is no visible gradient at all — a dark
             scrim over a dark surface is invisible, which is correct
             behaviour and looks like a bug.

         ★ SO THE TRADE IS REFUSED AND THE DOSSIER IS CLOSED. `default` puts
           the web app BELOW the status bar: the bar is opaque, iOS paints it
           with `theme-color` and picks contrasting glyphs itself,
           `env(safe-area-inset-top)` is 0, and every rule that scales by
           `--status-inset` collapses to nothing — including the gradient,
           which is what "remove the gradient" means in practice. Option B's
           dark scrim rule is DELETED from `index.css` rather than left behind
           a flag; a rule nothing can reach is a rule that rots.

         ⚠️ IT IS WRITTEN OUT AS `default` INSTEAD OF BEING DELETED. Absent and
           `default` behave identically on iOS, and a tag that states the
           decision is what stops this being re-litigated by the next person
           who reads the file and finds nothing there. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="לא ינום" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>לא ינום</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
