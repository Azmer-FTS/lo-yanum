name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      # PO POINT 0 — WHICH BASEMAP THIS BUILD POINTS AT, AND WHY IT IS NO LONGER
      # A QUESTION. REWRITTEN 2026-09-01; ETAT §27 AND §28 ARE THE MEASUREMENT.
      #
      # This step used to ASK THE SUPABASE BUCKET whether the national archive
      # was there, and fall back to a southern extract when it was not. It fell
      # back on every run for three days, and the product owner saw the Negev on
      # a national programme four times.
      #
      # ★ THE ARCHIVE WAS NEVER GOING TO ARRIVE IN THAT BUCKET. `lo-yanum-prod`
      #   refuses any upload over 52 428 800 bytes (50 MiB) and the national cut
      #   is 94 268 129. Bounded to the byte: a TUS create declaring exactly
      #   50 MiB is refused on AUTHORISATION (403); one byte more is refused on
      #   SIZE (413), before the server looks at who is asking. So the act four
      #   reports were waiting on was IMPOSSIBLE, not pending — no coordinator
      #   token and no dashboard could have done it. The bucket's own
      #   `file_size_limit` is 209 715 200; the cap is the PLAN's.
      #
      # SO THE ARCHIVE IS SHIPPED WITH THE APP INSTEAD, and there is no longer
      # anything to resolve. It is stored as a release asset (GitHub allows 2 GB
      # there), pulled onto the runner, and staged into `public/basemap/` so
      # that Vite copies it into `dist/` like any other public asset. Pages then
      # serves it from the app's OWN ORIGIN, which is measured to answer a range
      # request with 206, `accept-ranges: bytes` and `access-control-allow-origin: *`.
      #
      # ⚠️ THE RELEASE ASSET CANNOT BE THE BROWSER'S URL, AND IT WAS TRIED. It
      #    serves the right bytes and answers 206, but sends NO
      #    `access-control-allow-origin`, so a cross-origin PMTiles read fails.
      #    The release is STORAGE. Pages is the HOST. Do not "simplify" this by
      #    pointing `basemap.ts` at the release URL.
      #
      # ⚠️ THE LENGTH IS EXACT AND THE MAGIC IS CHECKED. A re-cut archive is a
      #    NEW name (the OSM build date is in it), so a different length on this
      #    name is a truncated download, and a truncated PMTiles archive is a
      #    blank map that reports success. Both are hard failures here: better a
      #    red deploy than a silent one, which is the whole lesson of §27.
      - name: Stage the basemap archive into the Pages payload
        run: |
          set -euo pipefail

          # ⚠️ THE RELEASE ASSET AND THE SERVED OBJECT HAVE DIFFERENT NAMES,
          #    AND THE DIFFERENCE IS THE WHOLE OF §29. The bytes are identical
          #    and nothing was re-uploaded; only the extension Pages sees
          #    changes, because the extension IS the content-type and the
          #    content-type IS whether Fastly gzips the object. Measured on the
          #    live site: `application/octet-stream` (what `.pmtiles` gets) is
          #    compressed, and a `Range` is then applied to the COMPRESSED
          #    stream — `content-range: …/93926002` instead of /94268129 — so
          #    every PMTiles read after the first landed on the wrong bytes and
          #    the deep zooms came back empty. `image/png` is not compressed.
          asset_name='israel-20260831-z14.pmtiles'
          key='israel-20260831-z14.pmtiles.png'
          expected=94268129
          asset="https://github.com/${GITHUB_REPOSITORY}/releases/download/basemap-israel-20260831/${asset_name}"

          mkdir -p public/basemap
          curl --silent --show-error --location --fail --max-time 600 \
               --output "public/basemap/${key}" "${asset}"

          actual="$(wc -c < "public/basemap/${key}" | tr -d ' ')"
          magic="$(head -c 7 "public/basemap/${key}" || true)"

          echo "key    : ${key}"
          echo "bytes  : ${actual} (expected ${expected})"
          echo "magic  : ${magic} (expected PMTiles)"

          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Basemap staging: the release asset downloaded ${actual} bytes, not ${expected}. A truncated archive draws a blank map and reports success. Refusing to deploy."
            exit 1
          fi

          if [ "${magic}" != "PMTiles" ]; then
            echo "::error::Basemap staging: public/basemap/${key} does not begin with the PMTiles magic (got '${magic}'). Refusing to deploy."
            exit 1
          fi

          echo "::notice::Basemap: ${key} staged into the Pages payload at ${expected} bytes — this build carries the NATIONAL archive on its own origin."

      # P2.3 — the deployed app is a REAL build: it requires a Supabase session.
      # Both values are public by design (the publishable key names the project
      # and authorises nothing; the security is the RLS), but they live in
      # repository secrets rather than in the tree so that rotating the key is
      # one settings change and not a commit. If either secret is missing the
      # build still succeeds and ships DEMO MODE — which is why `bun run auth`
      # asserts the login screen exists rather than trusting the deploy.
      - name: Build
        run: bun x vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # ★ DELIBERATELY UNSET. The archive now ships inside the payload, so
          #   the compiled-in constant in `basemap.ts` — resolved against
          #   `document.baseURI` — is already the right answer, and an override
          #   here could only point the app AWAY from the map it is shipping
          #   with. `VITE_BASEMAP_URL` survives for `bun run ground`'s
          #   `GROUND_URL` branch and for a local re-cut, and nothing else.


      # PO POINT 4 — THE PERMANENT GATE: WHAT THE BUNDLE ASKS FOR HAS TO BE THE
      # NATIONAL MAP, AND IT HAS TO BE IN THE ARTEFACT. Rewritten 2026-09-01.
      #
      # The step above decides what to SHIP. This one reads the BUILT FILES and
      # checks what they ended up asking for — the product owner's own
      # condition, and the right one: `dist/` is the artefact, and the iPad only
      # ever sees the artefact.
      #
      # ★ IT IS NOW A FLAT "MUST BE NATIONAL", AND THAT IS THE CHANGE. The old
      #   gate had one branch that warned and shipped: the bundle asking for the
      #   southern extract while the national archive was missing from the
      #   bucket. That leniency was correct while the upload was somebody's
      #   pending act, and it is wrong now that it was never possible (§27) and
      #   the archive travels inside the payload. There is nobody left to wait
      #   for, so a build that does not carry the country is a broken pipeline,
      #   and a broken pipeline must not reach an iPad quietly.
      #
      # WHAT FAILS THE BUILD
      #   · the bundle names no archive at all                    → FAIL
      #   · it names more than one, or one that is not national   → FAIL
      #   · the archive is not in `dist/` at its exact length     → FAIL
      #   · what is in `dist/` is not a PMTiles archive           → FAIL
      #
      # ⚠️ THE LENGTH IS EXACT AND NOT A THRESHOLD, AND THIS IS THE FOURTH TIME
      #    THE NUMBER HAS HAD TO BE CORRECTED IN THIS FILE'S HISTORY. The
      #    national cut is 94 268 129 bytes — 94.3 MB, NOT 175. A "> 100 MB"
      #    rule would refuse the real national map for ever and pass any 120 MB
      #    extract of anywhere. Exact equality also catches what a threshold
      #    cannot: a truncated copy on a name that is already trusted.
      - name: Gate — the basemap the built bundle asks for
        run: |
          set -euo pipefail

          # The register of cut archives: key, exact bytes, national yes/no.
          # A new cut is a NEW NAME (the OSM build date is in it), so this list
          # grows by one line and never edits one.
          national_key='israel-20260831-z14.pmtiles.png'
          len_israel_20260831_z14=94268129
          len_negev_20260829_z14=42560293

          registered_length() {
            case "$1" in
              israel-20260831-z14.pmtiles.png) printf '%s' "${len_israel_20260831_z14}" ;;
              israel-20260831-z14.pmtiles)     printf '%s' "${len_israel_20260831_z14}" ;;
              negev-20260829-z14.pmtiles)      printf '%s' "${len_negev_20260829_z14}" ;;
              *) return 1 ;;
            esac
          }

          # ---- 1. what does the ARTEFACT name? -----------------------------
          # The URL is built with `new URL()`, so minification leaves the KEY
          # intact as one string — and it is also the thing a coordinator reads
          # on the הגדרות screen. The same identifier at both ends.
          # ★ THE `.png` MUST BE PART OF WHAT IS MATCHED (§29). Without the
          #   optional group this pattern truncates the name back to
          #   '....pmtiles', the gate then looks for a file that is not in the
          #   artefact under that name, and the deploy fails for the wrong
          #   reason — or worse, passes on a stale one.
          keys="$(grep -ohE '[A-Za-z0-9._-]+\.pmtiles(\.png)?' dist/assets/*.js 2>/dev/null | sort -u || true)"

          if [ -z "${keys}" ]; then
            echo "::error::Basemap gate: the built bundle names no .pmtiles archive at all. The map would not draw. Refusing to deploy."
            exit 1
          fi

          echo "archives named in dist/assets/*.js:"
          printf '  %s\n' ${keys}

          count="$(printf '%s\n' ${keys} | wc -l | tr -d ' ')"
          if [ "${count}" != "1" ]; then
            echo "::error::Basemap gate: the bundle names ${count} different archives, so which one the app would use cannot be read off the artefact. Refusing to deploy."
            exit 1
          fi

          live="${keys}"
          echo "live archive : ${live}"

          # ---- 2. it must be the NATIONAL one ------------------------------
          if [ "${live}" != "${national_key}" ]; then
            echo "::error::Basemap gate: the bundle asks for '${live}', not the national archive ${national_key}. The product owner saw the Negev on a national programme four times; that is the regression this line exists to stop. Refusing to deploy."
            exit 1
          fi

          if ! expected="$(registered_length "${live}")"; then
            echo "::error::Basemap gate: '${live}' is not in this workflow's register of cut archives. A new cut must be added here with the exact byte length it was measured at, so that a truncated copy on a trusted name cannot ship. Refusing to deploy."
            exit 1
          fi

          # ---- 3. and it must actually BE in the artefact -------------------
          # The whole point of §28: the map is no longer somewhere else that
          # might answer. It is a file in `dist/`, or the deploy is refused.
          archive="dist/basemap/${live}"

          if [ ! -f "${archive}" ]; then
            echo "::error::Basemap gate: the bundle asks for '${live}' and ${archive} does not exist. The build would ship an app whose map is a 404. Refusing to deploy."
            exit 1
          fi

          actual="$(wc -c < "${archive}" | tr -d ' ')"
          magic="$(head -c 7 "${archive}" || true)"

          echo "artefact     : ${archive}"
          echo "bytes        : ${actual} (registered ${expected})"
          echo "magic        : ${magic} (expected PMTiles)"

          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Basemap gate: ${archive} holds ${actual} bytes, not ${expected}. A truncated archive draws a blank map and reports success. Refusing to deploy."
            exit 1
          fi

          if [ "${magic}" != "PMTiles" ]; then
            echo "::error::Basemap gate: ${archive} does not begin with the PMTiles magic (got '${magic}'). Refusing to deploy."
            exit 1
          fi

          echo "::notice::Basemap gate: the bundle asks for the NATIONAL archive ${live}, and it is in the artefact at ${expected} bytes with the PMTiles magic. Passed."

      # PO RULE, 2026-09-01 — THE ONLY EVIDENCE HE ACCEPTS ON THE BASEMAP IS A
      # REAL BROWSER ON A BLANK PROFILE. AND IT IS PERMANENT, NOT A ONE-OFF.
      #
      # The two steps above ask the BUCKET and read the BUILT FILES. Both are
      # true and neither is what he sees: three "it is fixed" reports in a row
      # were argued from exactly that kind of evidence, and all three were
      # refused on his iPad. `bun run ground` starts a fresh Chromium profile —
      # no storage, no service worker, no cache — points it at a build carrying
      # the same basemap input this deploy resolved, and reports the four
      # things and nothing else:
      #
      #   1  the pmtiles URL that actually leaves the browser, logged verbatim;
      #   2  the 206 and the archive's TOTAL length, read off `content-range`;
      #   3  the הגדרות screen naming that same archive and those same MB;
      #   4  Haifa at z12, z13, z14 — features counted, and captured.
      #
      # ⚠️ WHY IT DRIVES A DEMO BUILD: the deployed app's first screen is a
      #    login door, and the one coordinator's password is the product
      #    owner's alone (ETAT §14.4). No gate can sign in and none should be
      #    able to. What decides the basemap is `VITE_BASEMAP_URL` and the
      #    constant behind it — the same two inputs in both modes.
      #
      # ★ IT NOW FAILS ON ANYTHING AT ALL, and that is the 2026-09-01 change.
      #    It used to print Haifa's three empty lines and let the build through
      #    while the national archive was missing from the bucket — correct
      #    while that upload was somebody's pending act, wrong now that it was
      #    never possible (§27) and the archive ships inside the payload. Same
      #    policy as the gate above, and for the same reason: there is nobody
      #    left to wait for, so an empty Haifa is a broken pipeline.
      - name: Chromium, for the browser gate
        run: bun x playwright install --with-deps chromium

      - name: Gate — the basemap in a REAL browser, blank profile
        run: bun run ground

      # ★ A84 — WHAT IS DRAWN ON TOP OF THE ARCHIVE, 2026-09-01. The step above
      #   proves the ground arrives; this one proves the two things the product
      #   owner asked for on it are actually RENDERED and not merely
      #   configured: a settled international border and a disputed / armistice
      #   line, distinguishable, in light AND dark; and the מפה / לוויין switch,
      #   including the half that only matters in the field — offline, the
      #   button is disabled with a stated reason and the map falls back to the
      #   national vector archive on its own.
      #
      # ⚠️ ITS ONE WARNING PATH IS SOMEBODY ELSE'S SERVER BEING DOWN, and never
      #    this app's wiring — the distinction is written out in the script.
      - name: Gate — borders and the satellite switch, in a REAL browser
        run: bun run backdrop

      # The captures ARE the report. Kept on every run, pass or fail, so that
      # "the map is cut at the north" is a file he can open rather than a claim.
      - name: The four proofs, as captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basemap-proofs
          path: docs/screenshots/basemap/
          if-no-files-found: warn

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ★★ §29 — THE GATE THAT WOULD HAVE CAUGHT IT, AND THE ONLY ONE THAT COULD.
  #
  # Every earlier basemap gate asks the SOURCE, the ARTEFACT or a LOCAL server.
  # This bug lived in none of those. The archive was perfect — sha256-identical
  # to the local cut, header intact, Jerusalem/Haifa/Eilat all decoding — and
  # the app was correct, and the deploy was green. What was wrong was ONE
  # RESPONSE HEADER, added by the host, on the way out, only when the client
  # says it accepts gzip. Nothing that runs before the deploy can see it, and
  # `curl` does not see it either unless it is told to ask the way a browser
  # asks. That is why every proof so far said the map was fine.
  #
  # So this job runs AFTER the deploy, against the real URL, and it asks the
  # exact question a browser asks:
  #
  #   1  a HEAD sending `Accept-Encoding: gzip` must come back with NO
  #      `content-encoding` and the exact registered length;
  #   2  a range in the MIDDLE of the file, sent the same way, must come back
  #      206 with `content-range: …/<the real length>` — the denominator is the
  #      tell: under compression it is the compressed size;
  #   3  and those bytes, gunzipped as a PMTiles tile, must be the Jerusalem
  #      z14 tile — byte-for-byte the same as the one in the artefact.
  #
  # If a future host, a future extension or a future "simplification" turns the
  # compression back on, this fails loudly on the run that did it.
  served:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Gate — the SERVED archive, asked the way a browser asks
        run: |
          set -euo pipefail

          base='https://azmer-fts.github.io/lo-yanum'
          key='israel-20260831-z14.pmtiles.png'
          expected=94268129
          # The Jerusalem z14 tile, located in the artefact: offset and length.
          tile_off=64777443
          tile_len=79256

          url="${base}/basemap/${key}"
          browser='Accept-Encoding: gzip, deflate, br, zstd'

          echo "--- 1. HEAD, as a browser sends it"
          head_h="$(curl --silent --show-error --fail --head -H "${browser}" "${url}")"
          printf '%s\n' "${head_h}" | tr -d '\r' | grep -iE '^(HTTP|content-type|content-encoding|content-length)' || true

          enc="$(printf '%s' "${head_h}" | tr -d '\r' | grep -i '^content-encoding:' || true)"
          if [ -n "${enc}" ]; then
            echo "::error::Served gate: the archive comes back with '${enc}'. A compressed object is range-sliced on the COMPRESSED stream, which aims every PMTiles read at the wrong bytes and empties the deep zooms — this is exactly ETAT §29. The served name must map to a content-type Fastly does not compress (image/png, font/woff2, application/pdf). Refusing."
            exit 1
          fi

          len="$(printf '%s' "${head_h}" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)"
          if [ "${len}" != "${expected}" ]; then
            echo "::error::Served gate: the archive announces ${len} bytes, not ${expected}. Refusing."
            exit 1
          fi

          echo "--- 2. a range in the MIDDLE of the file, as a browser sends it"
          range_h="$(curl --silent --show-error --fail -o /tmp/tile.bin -D - \
                       -H "${browser}" \
                       -r "${tile_off}-$((tile_off + tile_len - 1))" "${url}")"
          printf '%s\n' "${range_h}" | tr -d '\r' | grep -iE '^(HTTP|content-range|content-encoding|content-length)' || true

          cr="$(printf '%s' "${range_h}" | tr -d '\r' | awk 'tolower($1)=="content-range:"{print $NF}' | tail -1)"
          if [ "${cr}" != "bytes ${tile_off}-$((tile_off + tile_len - 1))/${expected}" ] && \
             [ "${cr}" != "${tile_off}-$((tile_off + tile_len - 1))/${expected}" ]; then
            echo "::error::Served gate: content-range came back '${cr}', expected a denominator of ${expected}. A different denominator means the range was applied to a re-encoded body. Refusing."
            exit 1
          fi

          got="$(wc -c < /tmp/tile.bin | tr -d ' ')"
          if [ "${got}" != "${tile_len}" ]; then
            echo "::error::Served gate: asked for ${tile_len} bytes at offset ${tile_off} and received ${got}. Refusing."
            exit 1
          fi

          echo "--- 3. and those bytes must BE the Jerusalem z14 tile"
          # PMTiles tile_compression = gzip (2) for this cut, so the slice must
          # gunzip cleanly into a Mapbox Vector Tile. A slice of the wrong bytes
          # cannot: that is precisely the failure the product owner was seeing.
          if ! gunzip -c /tmp/tile.bin > /tmp/tile.mvt 2>/tmp/gz.err; then
            echo "::error::Served gate: the Jerusalem z14 slice does not gunzip ($(cat /tmp/gz.err)). The bytes at that offset are not the tile that is there in the artefact. Refusing."
            exit 1
          fi
          mvt="$(wc -c < /tmp/tile.mvt | tr -d ' ')"
          echo "Jerusalem z14 tile: ${got} bytes on the wire, ${mvt} bytes of MVT"
          if [ "${mvt}" -lt 10000 ]; then
            echo "::error::Served gate: the Jerusalem z14 tile decoded to only ${mvt} bytes. Refusing."
            exit 1
          fi

          echo "::notice::Served gate: ${key} is served uncompressed at ${expected} bytes, ranges are exact, and the Jerusalem z14 tile decodes off the wire. Passed."

