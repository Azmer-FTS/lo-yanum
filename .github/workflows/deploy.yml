name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      # PO POINT 0 (2026-09-01) — WHICH BASEMAP THIS BUILD POINTS AT IS DECIDED
      # BY THE BUCKET, NOT BY A CONSTANT SOMEBODY HAS TO REMEMBER TO EDIT.
      #
      # WHY THIS STEP EXISTS. The national archive (all of Israel, 94 MB) can
      # only be uploaded by the product owner — writes to the `basemap` bucket
      # are coordinator-only and the one coordinator's password is his alone
      # (ETAT §14.4). So the source constant was deliberately left pointing at
      # the previous SOUTHERN extract, "until the object exists".
      #
      # ★ AND THAT IS EXACTLY THE BUG HE THEN FOUND ON HIS iPAD: a deploy that
      #   succeeded, an app whose own words say "the whole map of Israel", and
      #   42.6 MB of the Negev on the device. Nothing had failed. The upload
      #   and the one-line key change were two acts by two people, and the
      #   second one waits on a session that may not happen the same day.
      #
      # So the build ASKS THE BUCKET. If the national archive is there, at
      # exactly the length it was measured at, and the bucket answers a range
      # request with 206 — which is the one thing PMTiles cannot work without —
      # the build points at it. Otherwise it falls back to the compiled-in key
      # and says so loudly, because a silent fallback is how this started.
      #
      # ⚠️ THE LENGTH IS EXACT ON PURPOSE. A re-cut archive is a NEW name (the
      #    OSM build date is in it), so a different length on this name means a
      #    truncated or partial upload, and shipping that would take the map
      #    off the app entirely. Update both values here when the map is re-cut.
      - name: Resolve the basemap archive
        id: basemap
        run: |
          set -euo pipefail

          bucket='https://lvrptqmkjikkkhcxocbe.supabase.co/storage/v1/object/public/basemap'
          key='israel-20260831-z14.pmtiles'
          expected=94268129

          headers="$(curl --silent --show-error --head --max-time 30 "${bucket}/${key}" || true)"
          length="$(printf '%s' "${headers}" | tr -d '\r' \
                    | awk 'tolower($1) == "content-length:" { print $2 }' | tail -n1)"

          range="$(curl --silent --output /dev/null --max-time 30 \
                        --header 'Range: bytes=0-15' \
                        --write-out '%{http_code}' "${bucket}/${key}" || true)"

          echo "key      : ${key}"
          echo "length   : ${length:-<absent>} (expected ${expected})"
          echo "range    : HTTP ${range} (expected 206)"

          if [ "${length:-0}" = "${expected}" ] && [ "${range}" = "206" ]; then
            echo "url=${bucket}/${key}" >> "$GITHUB_OUTPUT"
            echo "::notice::Basemap: ${key} is in the bucket at ${expected} bytes and serves 206 — this build points at the NATIONAL archive."
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "::warning::Basemap: ${key} is not usable in the bucket yet (length ${length:-absent}, range ${range}). This build falls back to the key compiled into src/ui/components/basemap.ts — the SOUTHERN extract. See ETAT §14.4: the upload is the product owner's."
          fi

      # P2.3 — the deployed app is a REAL build: it requires a Supabase session.
      # Both values are public by design (the publishable key names the project
      # and authorises nothing; the security is the RLS), but they live in
      # repository secrets rather than in the tree so that rotating the key is
      # one settings change and not a commit. If either secret is missing the
      # build still succeeds and ships DEMO MODE — which is why `bun run auth`
      # asserts the login screen exists rather than trusting the deploy.
      - name: Build
        run: bun x vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Empty when the national archive is not in the bucket yet, and an
          # empty string is falsy — `basemap.ts` then keeps its own default.
          VITE_BASEMAP_URL: ${{ steps.basemap.outputs.url }}


      # PO POINT 4 (2026-09-01) — THE PERMANENT GATE: WHAT THE BUNDLE ACTUALLY
      # ASKS FOR HAS TO BE A MAP THAT EXISTS, AND ONCE THE NATIONAL ARCHIVE IS
      # IN THE BUCKET IT HAS TO BE THAT ONE.
      #
      # The step above decides which archive to POINT AT. This one reads the
      # BUILT FILES and checks what they ended up asking for — which is the
      # product owner's own condition, and the right one: the resolve step
      # states an intention, `dist/` is the artefact, and the iPad only ever
      # sees the artefact. Everything here is measured on `dist/`.
      #
      # ⚠️ THE THRESHOLD IS NOT "> 100 MB", AND THIS IS THE THIRD TIME THE
      #    NUMBER HAS HAD TO BE CORRECTED IN THIS FILE'S HISTORY. The national
      #    cut of Israel at z14 is 94 268 129 bytes — 94.3 MB. A "> 100 MB"
      #    rule would REFUSE THE REAL NATIONAL MAP for ever and pass any
      #    120 MB extract of anywhere. So the archives are named, one line
      #    each, with the exact length each was measured at and whether it
      #    covers the country. Exact equality also catches the failure a
      #    threshold cannot: a truncated or half-finished upload on a name that
      #    is already trusted.
      #
      # WHAT FAILS THE BUILD, AND WHAT ONLY WARNS
      #   · the bundle names no archive at all              → FAIL
      #   · it names an archive nobody has registered       → FAIL
      #   · the live archive is absent, the wrong length,
      #     or refuses a range request                      → FAIL
      #   · the national archive IS usable in the bucket and
      #     the bundle still asks for a partial extract     → FAIL   ← the regression guard
      #   · the national archive is NOT uploaded yet and the
      #     bundle asks for the southern extract            → warn, and deploy
      #
      # That last line is deliberate and is the only reason this gate is not a
      # flat "must be national". Failing it today would stop EVERY deploy —
      # including work that has nothing to do with the map — until an upload
      # only the product owner can perform. The day it lands, the fourth rule
      # closes behind it and the pipeline can never fall back again.
      - name: Gate — the basemap the built bundle asks for
        run: |
          set -euo pipefail

          bucket='https://lvrptqmkjikkkhcxocbe.supabase.co/storage/v1/object/public/basemap'

          # The register of cut archives: key, exact bytes, national yes/no.
          # A new cut is a NEW NAME (the OSM build date is in it), so this list
          # grows by one line and never edits one.
          national_key='israel-20260831-z14.pmtiles'
          len_israel_20260831_z14=94268129
          len_negev_20260829_z14=42560293

          registered_length() {
            case "$1" in
              israel-20260831-z14.pmtiles) printf '%s' "${len_israel_20260831_z14}" ;;
              negev-20260829-z14.pmtiles)  printf '%s' "${len_negev_20260829_z14}" ;;
              *) return 1 ;;
            esac
          }

          is_national() { [ "$1" = "${national_key}" ]; }

          # ---- 1. what does the ARTEFACT name? -----------------------------
          # The URL is a template literal, so minification splits it: the base
          # and the key are two strings in the file. The KEY is the thing that
          # survives intact, and it is also the thing a coordinator reads on
          # the הגדרות screen — the same identifier at both ends.
          keys="$(grep -ohE '[A-Za-z0-9._-]+\.pmtiles' dist/assets/*.js 2>/dev/null | sort -u || true)"

          if [ -z "${keys}" ]; then
            echo "::error::Basemap gate: the built bundle names no .pmtiles archive at all. The map would not draw. Refusing to deploy."
            exit 1
          fi

          echo "archives named in dist/assets/*.js:"
          printf '  %s\n' ${keys}

          # ---- 2. which one is LIVE? ---------------------------------------
          # `VITE_BASEMAP_URL` wins over the compiled-in default at runtime
          # (`basemap.ts`), and Vite inlines it as a whole URL — so when the
          # national key is present in the bundle it IS the one the app uses,
          # even if the superseded default string survives beside it.
          live=''
          for key in ${keys}; do
            if is_national "${key}"; then live="${key}"; fi
          done

          if [ -z "${live}" ]; then
            count="$(printf '%s\n' ${keys} | wc -l | tr -d ' ')"
            if [ "${count}" != "1" ]; then
              echo "::error::Basemap gate: the bundle names ${count} different archives and none is the national one, so which the app would use cannot be read off the artefact. Refusing to deploy."
              exit 1
            fi
            live="${keys}"
          fi

          echo "live archive : ${live}"

          # ---- 3. is it registered, and is it really there? ----------------
          if ! expected="$(registered_length "${live}")"; then
            echo "::error::Basemap gate: '${live}' is not in this workflow's register of cut archives. A new cut must be added here with the exact byte length it was measured at, so that a truncated upload on a trusted name cannot ship. Refusing to deploy."
            exit 1
          fi

          headers="$(curl --silent --show-error --head --max-time 60 "${bucket}/${live}" || true)"
          length="$(printf '%s' "${headers}" | tr -d '\r' \
                    | awk 'tolower($1) == "content-length:" { print $2 }' | tail -n1)"
          range="$(curl --silent --output /dev/null --max-time 60 \
                        --header 'Range: bytes=0-15' \
                        --write-out '%{http_code}' "${bucket}/${live}" || true)"

          echo "length       : ${length:-<absent>} (registered ${expected})"
          echo "range        : HTTP ${range} (needs 206)"

          if [ "${length:-0}" != "${expected}" ]; then
            echo "::error::Basemap gate: the bundle asks for '${live}' and the bucket answers ${length:-nothing} bytes, not ${expected}. Either the object is missing, or the upload is partial. A build whose map does not exist must not reach an iPad. Refusing to deploy."
            exit 1
          fi

          if [ "${range}" != "206" ]; then
            echo "::error::Basemap gate: '${live}' does not answer a range request with 206 (got ${range}). PMTiles reads an archive by ranges and nothing else; without this the map is a blank screen. Refusing to deploy."
            exit 1
          fi

          # ---- 4. the regression guard -------------------------------------
          if is_national "${live}"; then
            echo "::notice::Basemap gate: the bundle asks for the NATIONAL archive ${live}, present at ${expected} bytes and serving 206. Passed."
            exit 0
          fi

          nat_len="$(curl --silent --show-error --head --max-time 60 "${bucket}/${national_key}" \
                     | tr -d '\r' | awk 'tolower($1) == "content-length:" { print $2 }' | tail -n1 || true)"
          nat_range="$(curl --silent --output /dev/null --max-time 60 \
                            --header 'Range: bytes=0-15' \
                            --write-out '%{http_code}' "${bucket}/${national_key}" || true)"

          if [ "${nat_len:-0}" = "${len_israel_20260831_z14}" ] && [ "${nat_range}" = "206" ]; then
            echo "::error::Basemap gate: ${national_key} IS in the bucket and usable, and this bundle still asks for the partial extract '${live}'. That is the exact regression this gate exists to stop — the product owner saw the Negev on a national programme. Refusing to deploy."
            exit 1
          fi

          echo "::warning::Basemap gate: the bundle asks for the PARTIAL extract '${live}' (${expected} bytes), which is present and usable — so this build ships and the map draws. But it is the SOUTH, not the country: ${national_key} is still not in the bucket (length ${nat_len:-absent}, range ${nat_range}). The upload is the product owner's, ETAT §14.4. The moment it lands, this warning becomes a failure and the next deploy carries the national map."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
